name: ts

networks:
  traefik-proxy:
    name: "${TRAEFIK_PROXY_NETWORK_NAME:-traefik-proxy}"
    external: true

volumes:
  traefik_acme: {}

services:
  traefik:
    image: traefik:v3.5
    hostname: traefik
    # container_name: traefik
    restart: unless-stopped
    networks:
      - traefik-proxy
    ports:
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: udp
        mode: host
    command:
      - "--global.checknewversion=false"
      - "--global.sendAnonymousUsage=false"
      - "--providers.swarm=false"
      - "--providers.docker=false"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${TRAEFIK_PROXY_NETWORK_NAME:-traefik-proxy}"
      - "--providers.file.directory=/etc/traefik/dynamic_conf"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http3"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.le.acme.email=${TRAEFIK_LE_MAIL:-myemail@example.com}"
      - "--certificatesresolvers.le.acme.storage=/acme/acme.json"
#      - "--certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory"
      - "--certificatesresolvers.le.acme.tlschallenge=${TRAEFIK_LE_TLS_CHALLENGE:-false}"
      - "--certificatesresolvers.le.acme.keytype=RSA4096"
      - "--api=true"
      - "--api.insecure=false"
      - "--api.dashboard=true"
      - "--api.basepath=/traefik"
      - "--log.level=INFO"
      - "--accessLog=true"
    volumes:
      - "traefik_acme:/acme:rw"
      - "./dynamic_conf:/etc/traefik/dynamic_conf:ro"
    env_file:
      - ".env"
    environment:
      TZ: "${TZ:-Europe/Warsaw}"
