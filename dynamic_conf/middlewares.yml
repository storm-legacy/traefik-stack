http:
  middlewares:
    cors-middleware:
      headers:
        accessControlAllowOriginList:
          - "http://localhost"
          - "http://localhost:8080"
          - "capacitor://localhost"
        accessControlAllowHeaders:
          - "*"
        accessControlAllowMethods:
          - "*"
        accessControlMaxAge: 3600
        addVaryHeader: true
        referrerPolicy: no-referrer-when-downgrade

    redirect-middleware:
      redirectRegex:
        regex: "^https://localhost/(.*)"
        replacement: "https://localhost.local/${1}"
        permanent: true

    digest-auth-middleware:
      digestAuth:
        realm: "secured"
        users:
          - "admin:traefik:817374111f31cc282162486425ee5e9e" # admin:admin

    buffer-middleware:
      buffering:
        maxRequestBodyBytes: 33554432 # 32MB

    ratelimit-middleware:
      rateLimit:
        average: 100
        burst: 200

    compress-middleware:
      compress:
        encodings:
          - br
          - gzip
          - zstd
        minResponseBodyBytes: 65536
        excludedContentTypes:
          - text/event-stream
          - image/*
          - video/*
          - audio/*
          - font/*
          - application/zip
          - application/x-gzip
          - application/gzip
          - application/x-7z-compressed
          - application/x-rar-compressed
          - application/pdf
          - application/octet-stream

    general-chain-middleware:
      chain:
        middlewares:
          - ratelimit-middleware
          - buffer-middleware
          - compress-middleware

    whitelist-middleware:
      IPAllowList:
        sourceRange:
          # Internal
          - 127.0.0.1/32
          - '{{ env "TRAEFIK_PROXY_NETWORK_SUBNET" }}'
